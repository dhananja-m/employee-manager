<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4 text-primary">Edit Employee</h2>

    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark fw-bold">Update Employee Details</div>
        <div class="card-body">
            <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Phone (10 digits)</label>
                        <input type="text" th:field="*{phone}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" th:field="*{department}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" step="0.01" th:field="*{salary}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Update Employee</button>
                    <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
