<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4 text-primary">Employee Management System</h2>

    <!-- Green Success Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Registration Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">Add New Employee</div>
        <div class="card-body">
            <form th:action="@{/employees}" th:object="${employee}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Kasun Perera">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. kasun@example.com">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Phone (10 digits)</label>
                        <input type="text" th:field="*{phone}" class="form-control" placeholder="0771234567">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" th:field="*{department}" class="form-control" placeholder="e.g. IT">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" step="0.01" th:field="*{salary}" class="form-control" placeholder="85000">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee Table -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold">Employee List</span>
            <span class="badge bg-secondary">Total: <span th:text="${#lists.size(employees)}">0</span></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="text-center text-muted py-3">No employees registered yet.</td>
                </tr>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>
                    <td>
                        <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to delete this employee?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://jsdelivr.net"></script>
</body>
</html>
